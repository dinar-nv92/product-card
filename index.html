<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/compound.css">
    <link rel="stylesheet" href="/style/tittle.css">
    <link rel="stylesheet" href="/style/card.css">
    <link rel="stylesheet" href="/style/clear-list.css">
    <link rel="stylesheet" href="/style/products.css">
    <link rel="stylesheet" href="/style/container.css">
    <link rel="stylesheet" href="/style/button.css">
  </head>
  <body>
    <main class="main">
      <div class="container">
        <div class="button">
          <button id="change-color-first-card">Изменить цвет первой карточки</button>
          <button id="change-color-all-card">Изменить цвет всех карточек</button>
          <button id="transition-to-Google">Перейти в Google</button>
          <button id="out-log-and-alert">Вывод ДЗ&#8470;6</button>
          <button id="change-color-button">Изменить цвет кнопки</button>
        </div>
        <h1 class="tittle">Выбери свой продукт</h1>
        <ul id="product-list" class="products clear-list">
          <template id="card-template">
          <li class="products__item card">
            <img class="card__image" src="" alt="" />
            <span class="card__category"></span>
            <h2 class="card__name"></h2>
            <p class="card__description"></p>
            <div class="card__compound compound">
              <span class="compound__name">Состав:</span>
              <ul class="compound__list"></ul>
            </div>
            <div class="card__price">
              <b class="card__price card__price--bold">Цена:</b>
              <span class="card__price--quantity"></span>
            </div>
          </li>
          </template>
        </ul>
      </div>
    </main>
    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script type="module" src="homework-9.js"></script>
    <script type="module" src="homework-10.js"></script>
  </body>
  </html>
