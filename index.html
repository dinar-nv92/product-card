<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/compound.css">
    <link rel="stylesheet" href="/style/tittle.css">
    <link rel="stylesheet" href="/style/card.css">
    <link rel="stylesheet" href="/style/clear-list.css">
    <link rel="stylesheet" href="/style/products.css">
    <link rel="stylesheet" href="/style/container.css">
    <link rel="stylesheet" href="/style/button.css">
    <link rel="stylesheet" href="/style/footer.css">
    <link rel="stylesheet" href="/style/modal-window.css">
  </head>
  <body>
    <main class="main">
      <div class="container">
        <div class="button">
          <button id="change-color-first-card">Изменить цвет первой карточки</button>
          <button id="change-color-all-card">Изменить цвет всех карточек</button>
          <button id="transition-to-Google">Перейти в Google</button>
          <button id="out-log-and-alert">Вывод ДЗ&#8470;6</button>
          <button id="change-color-button">Изменить цвет кнопки</button>
        </div>
        <h1 class="tittle">Выбери свой продукт</h1>
        <ul id="product-list" class="products clear-list">
          <template id="card-template">
          <li class="products__item card">
            <img class="card__image" src="" alt="" />
            <span class="card__category"></span>
            <h2 class="card__name"></h2>
            <p class="card__description"></p>
            <div class="card__compound compound">
              <span class="compound__name">Состав:</span>
              <ul class="compound__list"></ul>
            </div>
            <div class="card__price">
              <b class="card__price card__price--bold">Цена:</b>
              <span class="card__price--quantity"></span>
            </div>
          </li>
          </template>
        </ul>
      </div>
    </main>
    
    <footer>
      <div class="footer__content">
        <div class="footer-first">
          <h1 class="footer__tittle">Product Cards</h1>
          <p>У Нас Самые Лучшие Продукты Для Кожи!</p>
          <div class="ikon">
            <img src="/img/vector_telegram.png" alt="Telegram">
            <img src="/img/vector_vk.png" alt="VK">
          </div>
        </div>
        <div class="subscription-wrapper">
          <p class="subscription">Подпишись на наши акции:</p>
          <form id="email-form">
            <div class="email-form__line"></div>
            <input class="email-form__input" placeholder="Введи Email..." name="email" type="email">
            <button class="email-form__button" type="submit">Подписаться</button>
          </form>
          <button id ="registration-button">Регистрация</button>
        </div>
        <nav class="menu">
          <span>Быстрые ссылки</span>
          <ul class="menu__list">
            <li class="menu__list">Главная</li>
            <li class="menu__list">Магазин</li>
            <li class="menu__list">Контакты</li>
          </ul>
        </nav>
      </div>
      <div class="footer__line"></div>
      <p class="footer__website">www.product-cards.com©all right reserve</p>
    </footer>
    <div class="modal-overlay"></div>
    <div class="modal">
      <div class="modal__head">
        <h3>Регистрация</h3>
        <button id="closeModalWindow">Закрыть</button>
      </div>
      <div>
        <p>Имя</p>
        <input id="userName" class="modal__input" required placeholder="Ваше имя">
        <p>Фамилия</p>
        <input id="userLastName" class="modal__input" required placeholder="Ваша фамилия">
        <p>Дата рождения</p>
        <input id="userBirthday" class="modal__input" placeholder="Ваша дата рождения" type = "date">
        <p>Логин</p>
        <input id="userLogin" class="modal__input" required placeholder="Ваш логин">
        <p>Пароль</p>
        <input id="userPassword" class="modal__input" placeholder="Ваш пароль" type = "password">
        <p>Введите пароль ещё раз</p>
        <input id="userDoublePassword" class="modal__input" placeholder="Ваш пароль" type = "password">
        <div class="modal__navigation">
          <button id="resetModalInputBtn" class="modal__navigation-button">Сбросить всё</button>
          <button id="submitTheFormBtn" class="modal__navigation-button">Отправить</button>
        </div>
      </div>
    </div>
    
    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script type="module" src="homework-9.js"></script>
    <script type="module" src="homework-10.js"></script>
    <script type="module" src="homework-11.js"></script>
  </body>
  </html></div>
